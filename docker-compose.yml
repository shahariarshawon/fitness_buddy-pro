services:
  # ==========================================
  # Database Service (MongoDB)
  # ==========================================
  mongodb:
    image: mongo:7-jammy
    container_name: fitness-buddy-pro-db
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: fitnessBuddyPro
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # Backend API Server
  # ==========================================
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: fitness-buddy-pro-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongodb:27017/fitnessBuddyPro
      JWT_SECRET: production_jwt_secret_fitness_buddy_pro_2026
      JWT_EXPIRES_IN: 7d
      JWT_REFRESH_SECRET: production_refresh_secret_fitness_buddy_pro_2026
      JWT_REFRESH_EXPIRES_IN: 30d
      CLIENT_URL: http://localhost:8080
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # Frontend Web Client
  # ==========================================
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: fitness-buddy-pro-web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      VITE_API_URL: http://localhost:5000/api
    depends_on:
      server:
        condition: service_healthy

volumes:
  mongo_data:
    driver: local
